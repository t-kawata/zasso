[package]
name = "anthropx"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
http = "1"
tokio = { version = "1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
