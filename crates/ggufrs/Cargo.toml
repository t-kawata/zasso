[package]
name = "ggufrs"
version = "0.1.0"
edition = "2021"
description = "Rust GGUF model inference engine built on mistralrs — library API and HTTP server (OpenAI/Anthropic compatible)"
license = "MIT OR Apache-2.0"

[dependencies]
# mistralrs — GGUF 推論バックエンド
# CPU-Only を基本とし、GPU feature は cargo feature で分離
# GGUF はデフォルトでサポートされるため、feature 指定不要
# [::STUB::] M0-1: cargo update で適宜バージョン追従
mistralrs = { version = "0.8.1", default-features = false }

# 非同期ランタイム
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# HTTP サーバー（Axum ルーティング層）
axum = "0.8"

# 直列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 非同期ストリーム
futures = "0.3"

# エラー型
thiserror = "2"
anyhow = "1"

# トレイト非同期化
async-trait = "0.1"

# ロギング
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Anthropic ↔ OpenAI プロトコル変換（/anthropic/v1/messages 用）
# ドキュメント: https://docs.rs/llm-bridge-core/latest/llm_bridge_core/
# GitHub: https://github.com/TokenFleet-AI/llm-bridge-rust/tree/master
llm-bridge-core = "0.2"
llama-cpp-2 = "0.1.150"
tokio-stream = "0.1.18"

[dev-dependencies]
mockall = "0.14.0"
# ルーター結合テストで tower::util::ServiceExt を使用する
tower = "0.5"
# 結合テスト（tests/）で HTTP クライアントとして使用する
reqwest = { version = "0.12", features = ["json"] }

[features]
default = ["cpu"]
cpu = []
# GPU feature flags — 必要な環境でのみ有効化する
# metal / cuda
# 注: mistralrs v0.8.1 は directml feature を提供しない
metal = ["mistralrs/metal"]
cuda = ["mistralrs/cuda"]
# [::STUB::] M6-11: gbnf クレートが Cargo.toml に追加されたら gbnf の feature 依存を追加する
gbnf_integration = []

[lib]
name = "ggufrs"
crate-type = ["lib"]

[[bin]]
name = "test-run"
path = "src/bin/test-run.rs"
