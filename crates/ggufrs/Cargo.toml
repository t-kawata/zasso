[package]
name = "ggufrs"
version = "0.1.0"
edition = "2021"
description = "Rust GGUF model inference engine built on llama-cpp-2 — library API and HTTP server (OpenAI compatible)"
license = "MIT OR Apache-2.0"

[dependencies]
# llama-cpp-2 — GGUF 推論バックエンド（C++ FFI 経由）
# GPU バックエンドは cargo feature（metal/cuda）で選択し、
# build.rs で cmake 環境変数（LLAMA_METAL / LLAMA_CUDA）を設定する
llama-cpp-2 = "0.1.150"

# GBNF — JSON Schema → GBNF 文法変換（generate_structured 用）
gbnf = "0.2.7"

# 非同期ランタイム
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# HTTP サーバー（Axum ルーティング層）
axum = "0.8"

# 直列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 非同期ストリーム
futures = "0.3"

# エラー型
thiserror = "2"
anyhow = "1"

# トレイト非同期化
async-trait = "0.1"

# ロギング
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

tokio-stream = "0.1.18"

[dev-dependencies]
mockall = "0.14.0"
# ルーター結合テストで tower::util::ServiceExt を使用する
tower = "0.5"
# 結合テスト（tests/）で HTTP クライアントとして使用する
reqwest = { version = "0.12", features = ["json"] }

[features]
default = ["cpu"]
cpu = []
# GPU feature flags — 選択に応じて build.rs で cmake フラグを設定する
# metal / cuda
metal = []
cuda = []

[lib]
name = "ggufrs"
crate-type = ["lib"]

[[bin]]
name = "test-run"
path = "src/bin/test-run.rs"
