[package]
name = "siprs"
version = "0.1.0"
edition = "2021"
description = "Async Rust SIP client crate powered by PJSUA 2.17"
license = "MIT OR Apache-2.0"

[dependencies]
crossbeam-queue = "0.3"
dashmap = "6"
rubato = "3.0.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
static_assertions = "1.1.0"

[build-dependencies]
bindgen = { version = "0.71", default-features = false, features = ["runtime"] }

[features]
serde = ["dep:serde"]
tls = []
srtp = []
pjsip = []
