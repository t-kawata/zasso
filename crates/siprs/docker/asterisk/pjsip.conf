; [::TICKET::] P16-10: Asterisk PJSIP channel config for the docker
; integration-test base (§62.19 Q9b). Endpoints 1001/1002 mirror the
; registered accounts used by tests/sip_integration.rs. chan_sip (sip.conf)
; is deprecated on Asterisk 18+, so the PJSIP channel (pjsip.conf) is used.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5061

[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
direct_media=no
transport=transport-udp
aors=1001
auth=1001

[1001]
type=aor
max_contacts=1
qualify_frequency=30

[1001]
type=auth
auth_type=userpass
username=1001
password=password

[1002]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
direct_media=no
transport=transport-udp
aors=1002
auth=1002

[1002]
type=aor
max_contacts=1
qualify_frequency=30

[1002]
type=auth
auth_type=userpass
username=1002
password=password
