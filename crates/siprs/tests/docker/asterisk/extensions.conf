; [::STUB::] M20-1: 結合テスト用ダイヤルプラン
;
; test_context:
;   1001 -> Echo（media loopback）
;   1002 -> Echo（media loopback）
;   1001/test_user_1, 1002/test_user_2 間の通話

[test_context]

; test_user_1 の内線 — 自己ループバック
exten => 1001,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; test_user_2 の内線
exten => 1002,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; 名前ベースのルーティング（INVITE sip:test_user_1@... → Dial 1001）
exten => test_user_1,1,Answer()
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => test_user_2,1,Answer()
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()
