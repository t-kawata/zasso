; [::STUB::] M20-1: 結合テスト用モジュール設定（最小限、Ubuntu Asterisk）
[modules]
autoload = yes
; PJSIP 関連モジュール（Ubuntu では命名規則が異なる可能性があるため autoload に任せる）
; chan_pjsip.so と res_pjsip*.so は Ubuntu の asterisk パッケージに含まれる
load = res_pjsip.so
load = res_pjsip_endpoint_identifier_ip.so
load = res_pjsip_endpoint_identifier_user.so
load = res_pjsip_mwi.so
load = res_pjsip_outbound_registration.so
load = res_pjsip_pubsub.so
load = res_pjsip_session.so
load = chan_pjsip.so
load = app_dial.so
load = app_echo.so
load = pbx_config.so
noload = chan_sip.so
