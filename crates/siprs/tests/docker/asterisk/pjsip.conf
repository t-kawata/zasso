; [::STUB::] M20-1: 結合テスト用 PJSIP エンドポイント設定
;
; エンドポイント名は Asterisk ダイヤルプランの内線番号と一致させる。
; 1001 → test_user_1、1002 → test_user_2

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; === 1001 (test_user_1) ===
[1001]
type = endpoint
context = test_context
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
callerid = "Test User 1" <1001>
aors = 1001

[1001_aor]
type = aor
max_contacts = 2
remove_existing = yes

[1001_identify]
type = identify
endpoint = 1001
match = 0.0.0.0/0

; === 1002 (test_user_2) ===
[1002]
type = endpoint
context = test_context
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
callerid = "Test User 2" <1002>
aors = 1002

[1002_aor]
type = aor
max_contacts = 2
remove_existing = yes

[1002_identify]
type = identify
endpoint = 1002
match = 0.0.0.0/0
