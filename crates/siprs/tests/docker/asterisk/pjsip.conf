; [::STUB::] M20-1: 結合テスト用 PJSIP エンドポイント設定
;
; エンドポイントの識別は username（From URI）ベースで行う。
; IP ベース（identify）だと同ートランスポートの複数アカウントを区別できない。

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; === test_user_1 ===
[test_user_1]
type = endpoint
context = test_context
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
callerid = "Test User 1" <1001>
aors = test_user_1

[test_user_1]
type = aor
max_contacts = 2
remove_existing = yes

; === test_user_2 ===
[test_user_2]
type = endpoint
context = test_context
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
callerid = "Test User 2" <1002>
aors = test_user_2

[test_user_2]
type = aor
max_contacts = 2
remove_existing = yes
