; [::STUB::] M20-1: 結合テスト用 PJSIP エンドポイント設定
;
; test_user_1 — 認証成功テスト用（パスワード: test_pass_1）
; test_user_2 — 認証成功テスト用（2アカウント同時通話、DTMF 等）
; fail_user   — 認証失敗テスト用（パスワード不一致）

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; === test_user_1 ===
[test_user_1]
type = endpoint
context = test_context
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
callerid = "Test User 1" <1001>

[test_user_1_auth]
type = auth
auth_type = userpass
password = test_pass_1
username = test_user_1

[test_user_1_aor]
type = aor
max_contacts = 1
remove_existing = yes

[test_user_1]
auth = test_user_1_auth
aors = test_user_1_aor

; === test_user_2 ===
[test_user_2]
type = endpoint
context = test_context
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
callerid = "Test User 2" <1002>

[test_user_2_auth]
type = auth
auth_type = userpass
password = test_pass_2
username = test_user_2

[test_user_2_aor]
type = aor
max_contacts = 1
remove_existing = yes

[test_user_2]
auth = test_user_2_auth
aors = test_user_2_aor

; === fail_user（認証失敗テスト用）===
[fail_user]
type = endpoint
context = test_context
disallow = all
allow = ulaw

[fail_user_auth]
type = auth
auth_type = userpass
password = wrong_password
username = fail_user

[fail_user_aor]
type = aor
max_contacts = 1

[fail_user]
auth = fail_user_auth
aors = fail_user_aor
