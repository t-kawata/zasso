# [::STUB::] M20-1: 結合テスト用 Asterisk コンテナ
# 手動起動: docker compose -f tests/docker/docker-compose.yml up -d
# 手動終了: docker compose -f tests/docker/docker-compose.yml down
services:
  asterisk:
    image: asterisk:22-slim
    build:
      context: ./asterisk
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache asterisk asterisk-pjsip
        COPY pjsip.conf /etc/asterisk/pjsip.conf
        COPY extensions.conf /etc/asterisk/extensions.conf
        COPY modules.conf /etc/asterisk/modules.conf
        EXPOSE 5060/udp 5060/tcp
        CMD ["asterisk", "-f", "-U", "asterisk"]
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core ping"]
      interval: 5s
      retries: 10
      start_period: 10s
