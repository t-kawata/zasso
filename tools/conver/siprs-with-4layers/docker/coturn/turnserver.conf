# [::TICKET::] P16-10: coturn config for the docker integration-test base
# (§62.19 Q9b, Q7a). STUN binding needs no credentials; TURN allocate uses
# long-term credentials (lt-cred-mech) with the testuser/testpass pair that
# tests/sip_integration.rs configures in ClientConfig.turn_servers.
listening-port=3478
realm=test
lt-cred-mech
user=testuser:testpass
fingerprint
